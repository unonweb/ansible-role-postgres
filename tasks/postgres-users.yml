---
- tags: [role-postgres-user]
  when:
  - postgres_users is not string
  - postgres_users is iterable
  - postgres_users | length > 0
  block:

  # assert
  - name: Assertions for postgres-user
    loop: "{{ postgres_users }}"
    ansible.builtin.assert:
      that:
      - item.name != None
      - item.pw != None
      quiet: true

  # create db user
  - name: Manage database users
    become: true
    become_user: postgres # we must use this user because of the way postgres authentication works
    loop: "{{ postgres_users }}"
    community.postgresql.postgresql_user:
      name: "{{ item.name }}"
      password: "{{ item.pw }}"
      state: "{{ item.state | default('present') }}"
      encrypted: true
    no_log: true