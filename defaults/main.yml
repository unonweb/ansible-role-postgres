---
postgres_version: 17
postgres_user: postgres
postgres_group: postgres
postgres_dir_data: "/var/lib/postgresql/{{ postgres_version }}/main"
postgres_dir_config: "/etc/postgresql/{{ postgres_version }}/main"

# INSTALL
# -------
postgres_install_add_pkgs: []
# - postgis

# CONFIG
# ------
postgres_config_overrides: {}

# DATABASE
# --------
postgres_databases: []
# - item.name
#   item.owner

# USERS
# -----
postgres_users: []
# - item.name
#   item.pw

# EXTENSIONS
# ----------
postgres_extensions: []
# - postgis
# - pg_trgm
# - unaccent